<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
  <title>Оплаты — учёт по способам</title>
  <meta name="description" content="Учёт оплат клиентов в Google Таблице: QR, карта, наличные. Суммы и графики по дням.">

  <meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Оплаты">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="app-header">
      <div class="app-header__row">
        <h1 class="app-header__title">Оплаты</h1>
        <div class="app-header__actions">
          <span class="app-header__badge" id="header-total">—</span>
          <button class="icon-btn" type="button" id="refresh" aria-label="Обновить из таблицы">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/>
              <path d="M20.5 4.5V10h-5.5"/>
            </svg>
          </button>
        </div>
      </div>
      <p class="app-header__subtitle" id="header-subtitle">Сегодня</p>
      <div class="sync" id="sync" hidden></div>
    </header>

    <main class="view" id="view" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar" aria-label="Основная навигация">
      <button class="tabbar__btn" type="button" data-tab="entry">
        <span class="tabbar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </span>
        <span class="tabbar__label">Ввод</span>
      </button>
      <button class="tabbar__btn" type="button" data-tab="stats">
        <span class="tabbar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>
        </span>
        <span class="tabbar__label">Статистика</span>
      </button>
      <button class="tabbar__btn" type="button" data-tab="history">
        <span class="tabbar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8"/></svg>
        </span>
        <span class="tabbar__label">История</span>
      </button>
    </nav>
  </div>

  <div class="confirm-root" id="confirm-root"></div>
  <div class="toast-root" id="toast-root" role="status" aria-live="assertive"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
